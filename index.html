      const esc=value=>String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

      return '<div class="panel" id="panel-tuesday"><section><p class="section-kicker">Þriðjudagur · Excel 1</p><h2>Excel-grunnur og tölfræðilegir mælikvarðar</h2><article class="card info-card"><h3>Excel-skráin þín</h3><p>Búðu til eða opnaðu Excel-skrána þína. Hvert verkefni A1–A5 og B1–B4 á að vera á sérstökum worksheet-flipa sem heitir eftir verkefninu, til dæmis <strong>A1</strong>, <strong>A2</strong> eða <strong>B1</strong>.</p><p>Þegar þú byrjar á nýju verkefni velurðu auðan flipa og byrjar aftur efst í A1. Verkefnin yfirskrifa því ekki hvert annað.</p></article></section><section><p class="section-kicker">A · Leidd verkefni</p><h2>Excel 1</h2>'+A_ITEMS.filter(item=>item.day==='tuesday').map(aCard).join('')+'</section><section><p class="section-kicker">B · Sjálfstæð vinna</p><h2>Beittu vinnuferlinu</h2>'+B_ITEMS.filter(item=>item.day==='tuesday').map(bCard).join('')+'</section><div class="completion" data-day-complete="tuesday"><strong>Kjarnavinnu þriðjudags er lokið.</strong></div>'+selfSection('tuesday',['sett gögn skipulega upp og notað reitatilvísanir;','notað Excel-föll til að reikna miðsækni og dreifingu;','reiknað hlutfallsstíðni og búið til súlurit fyrir nafnabreytu.'])+'</div>'
    }
    function wednesdayHTML(){return '<div class="panel" id="panel-wednesday"><section><p class="section-kicker">Miðvikudagur · Excel 2</p><h2>Tíðnitöflur og myndræn framsetning</h2></section><section><p class="section-kicker">A · Leidd verkefni</p><h2>Excel 2</h2>'+A_ITEMS.filter(item=>item.day==='wednesday').map(aCard).join('')+'</section><section><p class="section-kicker">B · Sjálfstæð vinna</p><h2>Yfirfærðu aðferðirnar</h2>'+B_ITEMS.filter(item=>item.day==='wednesday').map(bCard).join('')+'</section><div class="completion" data-day-complete="wednesday"><strong>Kjarnavinnu miðvikudags er lokið.</strong></div>'+selfSection('wednesday',['reiknað miðpunkta, tíðni og f · X;','fundið áætlað meðaltal úr bilskiptri tíðnitöflu;','valið rétt myndrit fyrir flokka og samfelld gögn.'])+'</div>'}
    function thursdayHTML(){return '<div class="panel" id="panel-thursday"><section><p class="section-kicker">Fimmtudagur · Excel 3</p><h2>Samþætting og samanburður</h2></section><section><p class="section-kicker">B · Sjálfstæð vinna</p><h2>Lokasamþætting</h2>'+B_ITEMS.filter(item=>item.day==='thursday').map(bCard).join('')+'</section><div class="completion" data-day-complete="thursday"><strong>Kjarnavinnu fimmtudags er lokið.</strong></div>'+selfSection('thursday',['borið saman miðsækni og dreifingu tveggja gagnasafna;','notað dreifisvið og staðalfrávik til að túlka mun á hópum.'])+'<section><p class="section-kicker">Valfrjáls vinna</p><h2>Gögn fyrir lokaverkefni</h2><article class="card info-card"><p>Ef þú hefur lokið Excel-verkefnum vikunnar geturðu nýtt tímann sem eftir er til að vinna með gögn fyrir lokaverkefnið samkvæmt fyrirmælum kennara.</p></article></section></div>'}
    function placeholderHTML(id,label){
      return '<div class="panel" id="panel-'+id+'" aria-label="'+label+'"><section><article class="card info-card"><p><strong>Efni dagsins verður sett inn síðar.</strong></p></article></section></div>'
    }
    function weeklyHTML(){
      return '<div class="panel" id="panel-weekly"><section><p class="section-kicker">Vika 5 · Yfirlit</p><h2>Vikuskil</h2><p class="section-intro">Yfirlitið tekur aðeins mið af skylduvinnu Excel-lotunnar.</p><div class="card" id="weekSnapshot"><h3>Framvinduyfirlit · Vika 5</h3><div class="week-grid-wrap"><div class="week-grid" id="weekGrid"></div></div><div class="week-total"><div class="stat"><strong id="weekProgress">0%</strong>Heildarframvinda</div><div class="stat"><strong id="coreDone">0 af 6</strong>Kjarnaatriði</div><div class="stat"><strong id="wrongTotal">0</strong>Rangar A-tilraunir</div></div><p><strong>Rangar tilraunir, sjálfsmat og gögn fyrir lokaverkefni hafa ekki áhrif á framvindu.</strong></p></div><div class="card submission"><h3>Skilaðu eftirfarandi:</h3><ul><li>Excel-skránni sem kennari hefur óskað eftir;</li><li><strong>skjáskoti af framvinduyfirlitinu</strong>.</li></ul><button class="primary" id="submissionButton">Opna skilahólf</button></div></section></div>'
    }
    document.getElementById('tabs').innerHTML=tabs.map(tab=>'<button class="tab" type="button" data-tab="'+tab[0]+'">'+tab[1]+'</button>').join('');
    document.getElementById('main').innerHTML=tuesdayHTML()+wednesdayHTML()+thursdayHTML()+placeholderHTML('friday','Föstudagur')+weeklyHTML();
    const CORE_DAYS=['tuesday','wednesday','thursday'];
    function aComplete(day){const items=A_ITEMS.filter(item=>item.day===day);return items.length>0&&items.every(item=>!!state.aDone[item.id])}
    function dayCounts(day){const aItems=A_ITEMS.filter(item=>item.day===day),bItems=B_ITEMS.filter(item=>item.day===day);return{done:(aItems.length&&aComplete(day)?1:0)+bItems.filter(item=>!!state.bDone[item.id]).length,total:(aItems.length?1:0)+bItems.length}}
    function counts(){const days=CORE_DAYS.map(dayCounts);return{done:days.reduce((sum,item)=>sum+item.done,0),total:days.reduce((sum,item)=>sum+item.total,0),wrong:Object.values(state.aWrong).reduce((sum,n)=>sum+(Number(n)||0),0)}}
    function renderQuestion(card,item,key,choiceSelector,feedbackSelector,attemptSelector){
      const selected=state.aAnswers[key],done=item.followup&&key===item.id?!!state.aDone[item.id+'-primary']:!!state.aDone[key],feedback=card.querySelector(feedbackSelector),attempt=card.querySelector(attemptSelector),question=key===item.id?item:item.followup;
      card.querySelectorAll(choiceSelector).forEach((button,index)=>{button.classList.remove('selected','correct','incorrect');if(index===selected)button.classList.add(done?'correct':'incorrect');button.disabled=done;button.setAttribute('aria-pressed',String(index===selected))});
      if(done){feedback.className='feedback show good';feedback.textContent=question.ok}else if(Number.isInteger(selected)){feedback.className='feedback show bad';feedback.textContent='Ekki rétt. '+question.hint+' Reyndu aftur.'}else{feedback.className='feedback';feedback.textContent=''}
      const wrong=Number(state.aWrong[key])||0;attempt.hidden=!wrong;attempt.textContent=wrong?'Rangar tilraunir: '+wrong:'';
    }
    function renderA(card,item){
      if(item.followup&&state.aDone[item.id]&&!state.aDone[item.id+'-primary']&&!state.aDone[item.id+'-followup']){state.aDone[item.id+'-primary']=true;state.aDone[item.id+'-followup']=true;state.aAnswers[item.id]=item.correct;state.aAnswers[item.id+'-followup']=item.followup.correct;save()}
      renderQuestion(card,item,item.id,'[data-a-choice]','[data-a-primary-feedback]','[data-a-primary-attempt]');
      if(item.followup)renderQuestion(card,item,item.id+'-followup','[data-a-follow-choice]','[data-a-follow-feedback]','[data-a-follow-attempt]');
    }
    document.querySelectorAll('[data-a-id]').forEach(card=>{const item=A_ITEMS.find(entry=>entry.id===card.dataset.aId);renderA(card,item);card.querySelectorAll('[data-a-choice]').forEach(button=>button.addEventListener('click',()=>{const key=item.id;if(state.aDone[key]||state.aDone[key+'-primary'])return;const choice=Number(button.dataset.aChoice);state.aAnswers[key]=choice;if(choice===item.correct){if(item.followup)state.aDone[key+'-primary']=true;else state.aDone[key]=true}else state.aWrong[key]=(Number(state.aWrong[key])||0)+1;if(item.followup&&state.aDone[key+'-primary']&&state.aDone[key+'-followup'])state.aDone[key]=true;save();renderA(card,item);updateAll()}));card.querySelectorAll('[data-a-follow-choice]').forEach(button=>button.addEventListener('click',()=>{const key=item.id+'-followup';if(state.aDone[key])return;const choice=Number(button.dataset.aFollowChoice);state.aAnswers[key]=choice;if(choice===item.followup.correct)state.aDone[key]=true;else state.aWrong[key]=(Number(state.aWrong[key])||0)+1;if(state.aDone[item.id+'-primary']&&state.aDone[key])state.aDone[item.id]=true;save();renderA(card,item);updateAll()}))});
    document.querySelectorAll('[data-b-text]').forEach(area=>{area.value=state.bText[area.dataset.bText]||'';area.addEventListener('input',()=>{state.bText[area.dataset.bText]=area.value;save();const check=document.querySelector('[data-b-check="'+area.dataset.bText+'"]');if(check){const enough=area.value.trim().length>=20;if(!enough&&check.checked){check.checked=false;state.bDone[area.dataset.bText]=false;save();updateAll()}check.disabled=!enough}})});
    document.querySelectorAll('[data-b-check]').forEach(check=>{const id=check.dataset.bCheck,card=check.closest('[data-b-card]'),answer=card.querySelector('[data-b-answer]'),feedback=card.querySelector('[data-b-feedback]'),area=card.querySelector('[data-b-text]');if(area&&state.bDone[id]&&area.value.trim().length<20){state.bDone[id]=false;save()}check.checked=!!state.bDone[id];if(area)check.disabled=!check.checked&&area.value.trim().length<20;if(answer){answer.hidden=!check.checked;if(!check.checked){const details=answer.querySelector('details');if(details)details.open=false}}check.addEventListener('change',()=>{if(area&&check.checked&&area.value.trim().length<20){check.checked=false;feedback.className='feedback show bad';feedback.textContent='Skrifaðu fyrst efnislegt svar áður en þú staðfestir verkefnið.';return}feedback.className='feedback';feedback.textContent='';state.bDone[id]=check.checked;if(answer){answer.hidden=!check.checked;if(!check.checked){const details=answer.querySelector('details');if(details)details.open=false}}save();updateAll()})});
    const selfValues={tuesday:localStorage.getItem(SELF_KEY)||'',wednesday:localStorage.getItem(SELF_KEY+'-wednesday')||'',thursday:localStorage.getItem(SELF_KEY+'-thursday')||''};
    document.querySelectorAll('[data-self-day]').forEach(button=>{const day=button.dataset.selfDay;button.classList.toggle('active',button.dataset.self===selfValues[day]);button.addEventListener('click',()=>{selfValues[day]=button.dataset.self;localStorage.setItem(day==='tuesday'?SELF_KEY:SELF_KEY+'-'+day,selfValues[day]);document.querySelectorAll('[data-self-day="'+day+'"]').forEach(other=>other.classList.toggle('active',other.dataset.self===selfValues[day]));updateAll()})});
    function selfSummary(day){const value=selfValues[day];return value==='green'?'🟢 Örugg/ur':value==='yellow'?'🟡 Smá óvissa':value==='red'?'🔴 Þarf að skoða aftur':'—'}
    function updateAll(){
      const current=counts(),percent=Math.round(current.done/current.total*100);
      CORE_DAYS.forEach(day=>{const complete=document.querySelector('[data-day-complete="'+day+'"]'),dayCount=dayCounts(day);if(complete)complete.classList.toggle('show',dayCount.done===dayCount.total)});
      const names={tuesday:'Þriðjudagur',wednesday:'Miðvikudagur',thursday:'Fimmtudagur'};
      document.getElementById('weekGrid').innerHTML='<div class="week-cell week-head">Dagur</div><div class="week-cell week-head">Lokið</div><div class="week-cell week-head">Kjarni</div><div class="week-cell week-head">Sjálfsmat</div><div class="week-cell week-head">Rangar</div>'+CORE_DAYS.map(day=>{const item=dayCounts(day),wrong=A_ITEMS.filter(a=>a.day===day).reduce((sum,a)=>sum+(Number(state.aWrong[a.id])||0),0);return '<div class="week-cell"><strong>'+names[day]+'</strong></div><div class="week-cell">'+item.done+'/'+item.total+'</div><div class="week-cell">'+(item.done===item.total?'✓ Lokið':'○ Ólokið')+'</div><div class="week-cell">'+selfSummary(day)+'</div><div class="week-cell">'+wrong+'</div>'}).join('');
      document.getElementById('weekProgress').textContent=percent+'%';document.getElementById('coreDone').textContent=current.done+' af '+current.total;document.getElementById('wrongTotal').textContent=current.wrong;
      const active=document.querySelector('.tab.active')?.dataset.tab||'tuesday',bar=document.getElementById('progressBar'),label=document.getElementById('progressLabel');
      if(CORE_DAYS.includes(active)){const item=dayCounts(active),dayPercent=Math.round(item.done/item.total*100);bar.style.width=dayPercent+'%';label.textContent=item.done+' af '+item.total+' kjarnaatriðum dagsins lokið'}else if(active==='weekly'){bar.style.width=percent+'%';label.textContent=current.done+' af '+current.total+' kjarnaatriðum lokið'}else{bar.style.width='0%';label.textContent='Efni dagsins verður sett inn síðar'}
    }
    function switchTab(id){document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.tab===id));document.querySelectorAll('.panel').forEach(panel=>panel.classList.toggle('active',panel.id==='panel-'+id));localStorage.setItem(TAB_KEY,id);updateAll();window.scrollTo({top:0,behavior:'smooth'})}
    document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>switchTab(tab.dataset.tab)));
    document.getElementById('submissionButton').addEventListener('click',()=>window.open(SUBMISSION_URL,'_blank','noopener'));
    const savedTab=localStorage.getItem(TAB_KEY);switchTab(tabs.some(tab=>tab[0]===savedTab)?savedTab:'tuesday');
    if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise().catch(()=>{});
  })();
  </script>
</body>
</html>
